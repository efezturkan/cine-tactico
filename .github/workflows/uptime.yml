name: Site uptime

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Public pages answer 200
        run: |
          for path in "" "privacy" "support"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -L "https://cine-tactico.vercel.app/$path")
            echo "/$path -> $code"
            [ "$code" = "200" ] || exit 1
          done
