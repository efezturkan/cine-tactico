schema_version: 1
studio: cine-xox
product: Cine-XOX
slug: cine-tactico
genre: hybrid-casual-cinephile-tactics
platforms: [web, ios, android]
engine: next-capacitor
orientation: portrait

paths:
  spec: MASTER_SPECIFICATION_v3.md
  handover: docs/launch/SESSION_HANDOVER_TO_NEW_CHAT.md
  core: src/core
  data: src/data
  tests: src/tests

targets:
  shot_clock_seconds: 15
  golden_reel_seconds: 12
  min_valid_answers_per_cell: 3
  rarity_cap_when_pool_lt_3: rare

untouchable:
  - src/features/multiplayer/components/MatchmakingQueueModal.tsx
  - src/features/gameplay/components/ShotClock.tsx
  - src/features/gameplay/components/XoxBoard.tsx

mvp:
  clock_seconds: 12
  modes: [VS_BOT, PASS_AND_PLAY, ONLINE_ROOM]
  next_slice: home-is-play
  docs:
    - docs/product/MVP.md
    - docs/product/GAME_FEEL.md
    - docs/product/DATA_MODEL.md
    - docs/design/PRODUCTION.md
