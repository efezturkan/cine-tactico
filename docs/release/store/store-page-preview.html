<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crosscut — App Store page preview</title>
<style>
:root{
  --page:#0a0a0c; --page-ink:#f2f0ea; --page-mute:#8a8f9a; --gold:#d9a441;
  --bg:#000; --card:#1c1c1e; --ink:#fff; --mute:#8e8e93; --sep:#38383a; --blue:#0a84ff; --pill:#2c2c2e; --shot-line:rgba(255,255,255,.12);
}
body[data-theme="light"]{ --bg:#fff; --card:#f2f2f7; --ink:#000; --mute:#6c6c70; --sep:#d9d9de; --blue:#007aff; --pill:#e9e9ee; --shot-line:rgba(0,0,0,.14); }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--page);color:var(--page-ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif}
body{min-height:100vh;background:radial-gradient(1200px 500px at 50% -120px,#2a1b08 0,transparent 70%),var(--page)}
.top{max-width:1100px;margin:0 auto;padding:28px 24px 8px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.brand{display:flex;flex-direction:column;gap:4px}
.brand b{font-family:Georgia,"Times New Roman",serif;font-size:22px;letter-spacing:.18em;font-weight:700}
.brand b i{color:var(--gold);font-style:normal}
.brand span{font-size:13px;color:var(--page-mute)}
.ctl{display:flex;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;background:#17171b;border:1px solid #2a2a31;border-radius:999px;padding:3px}
.seg button{all:unset;cursor:pointer;padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--page-mute)}
.seg button[aria-pressed="true"]{background:var(--gold);color:#1a1205}
.stage{max-width:1100px;margin:0 auto;padding:16px 24px 8px;display:flex;gap:44px;justify-content:center;flex-wrap:wrap}
.wrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.wrap .cap{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--page-mute)}
.phone{width:414px;height:880px;border-radius:66px;background:linear-gradient(145deg,#3a3a40,#17171a 40%,#2c2c31);padding:12px;box-shadow:0 40px 80px rgba(0,0,0,.6),0 0 0 1.5px #4a4a52 inset,0 0 0 1px #000}
.screen{position:relative;width:390px;height:856px;border-radius:54px;overflow:hidden;background:var(--bg);color:var(--ink);transition:background .25s,color .25s}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;border-radius:20px;background:#000;z-index:30}
.status{position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:6px 34px 0 42px;font-size:16px;font-weight:600;z-index:25;background:var(--bg);transition:background .25s}
.status svg{height:12px;fill:var(--ink)}
.status .r{display:flex;gap:6px;align-items:center}
.scroll{position:absolute;inset:0;padding-top:54px;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.home-ind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:138px;height:5px;border-radius:3px;background:var(--ink);opacity:.9;z-index:40}
.nav{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 4px;color:var(--blue);font-size:17px}
.nav .t{display:flex;align-items:center;gap:2px}
.nav svg{width:12px;height:20px}
.hero{display:flex;gap:16px;padding:12px 18px 8px;align-items:flex-start}
.icon{width:118px;height:118px;border-radius:27px;flex:none;box-shadow:0 0 0 1px var(--shot-line);background-size:cover}
.hero h1{font-size:23px;line-height:1.18;margin:2px 0 4px;font-weight:700;letter-spacing:-.2px}
.hero .sub{color:var(--mute);font-size:15px;line-height:1.25}
.acts{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.get{all:unset;cursor:pointer;min-width:76px;height:32px;border-radius:16px;background:var(--blue);color:#fff;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;padding:0 18px;letter-spacing:.2px}
.get.loading{background:var(--pill);padding:0;min-width:32px;width:32px}
.get.done{background:var(--blue)}
.ring{width:22px;height:22px;border-radius:50%;border:3px solid var(--blue);border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.share{color:var(--blue);width:30px;height:30px;display:flex;align-items:center;justify-content:center}
.share svg{width:20px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.strip{display:flex;overflow-x:auto;scrollbar-width:none;padding:14px 0 14px;border-bottom:1px solid var(--sep);margin:6px 0 0}
.strip::-webkit-scrollbar{display:none}
.strip>div{flex:none;width:116px;text-align:center;padding:0 6px;border-left:1px solid var(--sep)}
.strip>div:first-child{border-left:0}
.strip small{display:block;font-size:11px;letter-spacing:.04em;color:var(--mute);font-weight:600;margin-bottom:5px}
.strip strong{display:block;font-size:22px;font-weight:700;color:var(--mute);height:28px;line-height:28px}
.strip span{display:block;font-size:12px;color:var(--mute);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec{padding:16px 18px 4px}
.sec h2{font-size:22px;margin:0 0 10px;font-weight:700;letter-spacing:-.2px}
.row-h{display:flex;justify-content:space-between;align-items:baseline}
.row-h span{color:var(--mute);font-size:14px}
.shots{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 18px 12px;scrollbar-width:none}
.shots::-webkit-scrollbar{display:none}
.shots img{flex:none;width:236px;border-radius:26px;box-shadow:0 0 0 1px var(--shot-line);scroll-snap-align:start;display:block}
.dev{padding:0 18px 12px;color:var(--mute);font-size:13px;display:flex;gap:8px;align-items:center}
.dev i{font-style:normal;display:inline-block;padding:1px 6px;border:1px solid var(--mute);border-radius:5px;font-size:11px}
.promo{padding:4px 18px 0;font-size:15px;line-height:1.4}
.desc{padding:14px 18px 0;font-size:15px;line-height:1.38}
.desc p{margin:0 0 9px}
.desc.clamp{max-height:132px;overflow:hidden;position:relative;-webkit-mask-image:linear-gradient(#000 70%,transparent)}
.moreb{all:unset;cursor:pointer;color:var(--blue);display:block;text-align:right;padding:6px 18px 0;font-size:15px}
.hr{height:1px;background:var(--sep);margin:14px 18px 0}
.privacy{margin:6px 18px 0;background:var(--card);border-radius:14px;padding:16px;display:flex;gap:14px;align-items:flex-start}
.privacy .ic{width:38px;height:38px;border-radius:50%;background:var(--pill);display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.privacy b{display:block;font-size:17px;margin-bottom:3px}
.privacy span{color:var(--mute);font-size:14px;line-height:1.3}
.info{padding:0 18px}
.info div{display:flex;justify-content:space-between;gap:20px;padding:11px 0;border-bottom:1px solid var(--sep);font-size:15px}
.info div span:first-child{color:var(--mute)}
.info div span:last-child{text-align:right}
.links{padding:12px 18px 0;display:flex;flex-direction:column;gap:12px;color:var(--blue);font-size:16px}
.pad{height:70px}
.search-top{display:flex;gap:12px;align-items:center;padding:10px 16px}
.field{flex:1;background:var(--pill);border-radius:12px;height:38px;display:flex;align-items:center;gap:8px;padding:0 10px;font-size:17px}
.field svg{width:16px;height:16px;fill:none;stroke:var(--mute);stroke-width:2.4;stroke-linecap:round}
.cancel{color:var(--blue);font-size:17px}
.result{padding:14px 16px 0}
.result .r1{display:flex;gap:14px;align-items:center}
.result .icon{width:64px;height:64px;border-radius:15px}
.result .nm{flex:1;min-width:0}
.result .nm b{display:block;font-size:17px;font-weight:600;line-height:1.2}
.result .nm span{display:block;color:var(--mute);font-size:14px;margin-top:2px}
.result .nm em{display:block;color:var(--mute);font-size:13px;font-style:normal;margin-top:2px}
.rs{display:flex;gap:8px;margin-top:14px}
.rs img{width:117px;border-radius:14px;box-shadow:0 0 0 1px var(--shot-line);display:block}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:88px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--sep);display:flex;justify-content:space-around;padding:9px 6px 0;z-index:35}
.tabbar div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--mute);width:62px}
.tabbar div.on{color:var(--blue)}
.tabbar svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.foot{max-width:760px;margin:10px auto 40px;padding:0 24px;text-align:center;color:var(--page-mute);font-size:13px;line-height:1.6}
.foot b{color:var(--page-ink)}
@media (max-width:980px){.stage{gap:30px}.phone{transform:scale(.92);transform-origin:top center;margin-bottom:-60px}}
</style>
</head>
<body data-theme="dark" data-lang="en">
<header class="top">
  <div class="brand"><b>CROSS<i>·</i>CUT</b><span id="sub">App Store page preview · built from real in-app screenshots</span></div>
  <div class="ctl">
    <div class="seg" role="group" aria-label="Language"><button data-lang="en" aria-pressed="true">EN</button><button data-lang="tr" aria-pressed="false">TR</button></div>
    <div class="seg" role="group" aria-label="Appearance"><button data-theme="dark" aria-pressed="true">Dark</button><button data-theme="light" aria-pressed="false">Light</button></div>
  </div>
</header>
<main class="stage">
  <section class="wrap"><div class="cap" id="cap1">Search results</div>
    <div class="phone"><div class="screen" id="s1"></div></div></section>
  <section class="wrap"><div class="cap" id="cap2">Product page</div>
    <div class="phone"><div class="screen" id="s2"></div></div></section>
</main>
<p class="foot" id="foot"></p>

d by any studio, film database or the people named in the puzzles."], "whatsnew": "What's New", "version": "Version 1.0", "now": "Now", "notes": "First release. Duels against Easy, Medium and Hard bots, Reverse Frame, Daily Reel, Auditorium Ambience.", "more": "more", "strip": [["RATINGS", "—", "No ratings yet"], ["AGE", "4+", "Years Old"], ["CATEGORY", "★", "Trivia"], ["DEVELOPER", "☺", "Efe Öztürkan"], ["LANGUAGE", "EN", "+ 1 MORE"]], "privacy": "App Privacy", "privacy_title": "Data Not Collected", "privacy_text": "The developer does not collect any data from this app.", "see": "See Details", "info": "Information", "rows": [["Seller", "Efe Öztürkan"], ["Size", "7 MB"], ["Category", "Games"], ["Compatibility", "iPhone · Requires iOS 15.0 or later"], ["Languages", "English, Turkish"], ["Age Rating", "4+"], ["Copyright", "© 2026 Efe Öztürkan"], ["Price", "Free"]], "links": ["App Support", "Privacy Policy"]}, "tr": {"name": "Crosscut: Film Bilgi Düellosu", "subtitle": "12 saniye. 9 kare. 1 film.", "category": "Oyunlar · Bilgi Yarışması", "get": "AL", "open": "AÇ", "back": "Ara", "cancel": "İptal", "games": "Oyunlar", "preview": "Önizleme", "device": "iPhone", "promo": "Quiz uygulamaları sana dört şık ve bir reklam verir. Crosscut bir saat verir. İki ipucuna da uyan filmi 12 saniye dolmadan bul. İnternetsiz çalışır. Hesap yok.", "desc": ["Quiz değil, düello.", "Her kare iki ipucu. İkisine de uyan filmi 12 saniyede bul, bot hattını kesmeden üçlüyü kur.", "Reklam yok. Hesap yok. İnternet gerekmez.", "<b>KURALLAR</b>", "Dokuz kare. Üç kare yan yana gelen kazanır. Yanlış cevap o karedeki hakkını yakar. Sayaç beklemez.", "<b>ÜÇ OYUN BİÇİMİ</b>", "• Klasik Düello: yönetmen, oyuncu, dönem, tür ve ödül 3x3 tahtada kesişir. Kolay, Orta ve Zor botların her birinin kendi tarzı var.", "• Ters Kadraj: iki film bir karede buluşur. İkisinde de oynayan oyuncuyu bul.", "• Sinefil Konsept: kült temalar, türler ve ödüllerle karşı karşıya.", "<b>GÜNDE BİR TAHTA</b>", "Günün Kadrası: herkese aynı dokuz kare, tek hak, skorunu gösteren ve hiçbir şey sızdırmayan sonuç kartı.", "<b>KATALOG</b>", "1.000'den fazla film ve dizi. Türkçe ve İngilizce anında başlık araması, alternatif adlarla. Aynı adlı iki film mi var? Yıl ayırır.", "<b>SALON</b>", "Salon ışıklarını kıs. Projeksiyon huzmesini ayarla. 35mm gren ekle ya da salonu kırmızıya boya.", "<b>KÜÇÜK PUNTO</b>", "Ücretsiz. Reklam yok. Uygulama içi satın alma yok. Takip yok. Tamamen çevrimdışı çalışır.", "Herhangi bir stüdyo, film veritabanı veya bulmacalarda adı geçen kişilerle bağlantılı ya da onaylı değildir."], "whatsnew": "Yenilikler", "version": "Sürüm 1.0", "now": "Şimdi", "notes": "İlk sürüm. Kolay, Orta ve Zor botlarla düello, Ters Kadraj, Günün Kadrası, Salon Işığı.", "more": "daha fazla", "strip": [["DEĞERLENDİRME", "—", "Henüz yok"], ["YAŞ", "4+", "Yaş"], ["KATEGORİ", "★", "Bilgi Yarışması"], ["GELİŞTİRİCİ", "☺", "Efe Öztürkan"], ["DİL", "TR", "+ 1 DİĞER"]], "privacy": "Uygulama Gizliliği", "privacy_title": "Veri Toplanmaz", "privacy_text": "Geliştirici bu uygulamadan hiçbir veri toplamaz.", "see": "Ayrıntılar", "info": "Bilgi", "rows": [["Satıcı", "Efe Öztürkan"], ["Boyut", "7 MB"], ["Kategori", "Oyunlar"], ["Uyumluluk", "iPhone · iOS 15.0 veya üstü"], ["Diller", "İngilizce, Türkçe"], ["Yaş Sınırı", "4+"], ["Telif Hakkı", "© 2026 Efe Öztürkan"], ["Fiyat", "Ücretsiz"]], "links": ["Uygulama Desteği", "Gizlilik Politikası"]}}, "shots": {"en": ["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHCAkIBgoJCAkMCwoMDxoRDw4ODx8WGBMaJSEnJiQhJCMpLjsyKSw4LCMkM0Y0OD0/QkNCKDFITUhATTtBQj//2wBDAQsMDA8NDx4RER4/KiQqPz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz//wAARCAQBAdgDASIAAhEBAxEB/8QAHAABAAIDAQEBAAAAAAAAAAAAAAIDAQQFBgcI/8QAVBAAAQMCAgUIBgYHBAgFBAMBAQACAwQRBRIGEyExUTIzNEFxcpGxFCJSU2GBB5KTocHRFSNCVGKCskNjdKMWRFWDhLPD4RckNvDxNTeUwiVk0nP/xAAZAQEBAQEBAQAAAAAAAAAAAAAAAQIDBAX/xAAyEQEAAgEFAAAFAQYGAwEAAAAAAQIRAxIhMUEEE1Fh8CIyQnGBkdEUIzSh4fEFRLHB/9oADAMBAAIRAxEAPwD5GiItIIiICIiAiIgIiICIiA const $ = (s, r = document) => r.querySelector(s);
const state = { lang: "en", theme: "dark", get: "idle" };
const SIG = '<svg viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>';
const WIFI = '<svg viewBox="0 0 17 12"><path d="M8.5 2.3c2.3 0 4.4.9 6 2.4l1.1-1.2A10.2 10.2 0 0 0 8.5.6C5.8.6 3.3 1.6 1.4 3.5l1.1 1.2a8.4 8.4 0 0 1 6-2.4Zm0 3.4c1.4 0 2.7.5 3.7 1.4l1.1-1.2a7 7 0 0 0-9.6 0l1.1 1.2c1-.9 2.3-1.4 3.7-1.4Zm0 3.3c.6 0 1.2.2 1.6.6L8.5 11.6 6.9 9.600c.4-.4 1-.6 1.6-.6Z"/></svg>';
const BAT = '<svg viewBox="0 0 27 12"><rect x=".5" y=".5" width="23" height="11" rx="3.2" fill="none" stroke="currentColor" opacity=".45"/><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="24.5" y="4" width="2" height="4" rx="1" opacity=".5"/></svg>';
const status = () => `<div class="island"></div><div class="status"><span>9:41</span><span class="r">${SIG}${WIFI}${BAT}</span></div>`;
const CHEV = '<svg viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2 2 10l8 8"/></svg>';
const SHARE = '<svg viewBox="0 0 20 22"><path d="M10 14V2M6 6l4-4 4 4M4 10H3v10h14V10h-1"/></svg>';
const SEARCH = '<svg viewBox="0 0 16 16"><circle cx="6.5" cy="6.5" r="5"/><path d="m10.5 10.5 4 4"/></svg>';
const TAB = {
  today: '<svg viewBox="0 0 26 26"><rect x="4" y="3" width="18" height="20" rx="4"/><path d="M8 9h10M8 13h6"/></svg>',
  games: '<svg viewBox="0 0 26 26"><path d="M5 18c1-6 3-9 8-9s7 3 8 9l-3 3-3-2h-4l-3 2-3-3Z"/><path d="M9 14h4M11 12v4"/></svg>',
  apps: '<svg viewBox="0 0 26 26"><path d="m13 3 9 5v10l-9 5-9-5V8l9-5Z"/><path d="M4 8l9 5 9-5M13 13v10"/></svg>',
  arcade: '<svg viewBox="0 0 26 26"><circle cx="13" cy="13" r="9"/><path d="M13 8v10M8 13h10"/></svg>',
  search: '<svg viewBox="0 0 26 26"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 6 6"/></svg>',
};
function tabbar(c) {
  const L = state.lang === "tr" ? ["Bugün", "Oyunlar", "Uygulamalar", "Arcade", "Ara"] : ["Today", "Games", "Apps", "Arcade", "Search"];
  return `<div class="tabbar">${["today","games","apps","arcade","search"].map((k, i) => `<div class="${k === "search" ? "on" : ""}">${TAB[k]}<span>${L[i]}</span></div>`).join("")}</div>`;
}
function getBtn() {
  const c = DATA.copy[state.lang];
  if (state.get === "loading") return `<button class="get loading" aria-label="Downloading"><span class="ring"></span></button>`;
  if (state.get === "done") return `<button class="get done">${c.open}</button>`;
  return `<button class="get">${c.get}</button>`;
}
function search(c, shots) {
  return `${status()}<div class="scroll">
    <div class="search-top"><div class="field">${SEARCH}<span>Crosscut</span></div><span class="cancel">${c.cancel}</span></div>
    <div class="result">
      <div class="r1"><img class="icon" src="${DATA.icon}" alt="" style="width:64px;height:64px;border-radius:15px"><div class="nm"><b>${c.name}</b><span>${c.subtitle}</span><em>${c.category}</em></div><div data-get>${getBtn()}</div></div>
      <div class="rs">${shots.slice(0, 3).map(s => `<img src="${s}" alt="">`).join("")}</div>
    </div></div>${tabbar()}<div class="home-ind"></div>`;
}
function product(c, shots) {
  return `${status()}<div class="scroll" id="sc2">
    <div class="nav"><span class="t">${CHEV}<span>${c.back}</span></span><span></span></div>
    <div class="hero"><img class="icon" src="${DATA.icon}" alt=""><div style="min-width:0;flex:1">
      <h1>${c.name}</h1><div class="sub">${c.subtitle}</div>
      <div class="acts"><div data-get>${getBtn()}</div><span class="share">${SHARE}</span></div></div></div>
    <div class="strip">${c.strip.map(s => `<div><small>${s[0]}</small><strong>${s[1]}</strong><span>${s[2]}</span></div>`).join("")}</div>
    <div class="sec"><div class="row-h"><h2>${c.preview}</h2></div></div>
    <div class="shots">${shots.map(s => `<img src="${s}" alt="">`).join("")}</div>
    <div class="dev"><i>${c.device}</i><span>${c.category}</span></div>
    <div class="promo">${c.promo}</div>
    <div class="desc clamp" id="desc">${c.desc.map(p => `<p>${p}</p>`).join("")}</div>
    <button class="moreb" id="more">${c.more}</button>
    <div class="hr"></div>
    <div class="sec"><div class="row-h"><h2>${c.whatsnew}</h2><span>${c.now}</span></div><div class="row-h" style="margin:-4px 0 8px"><span>${c.version}</span></div><div style="font-size:15px;line-height:1.38">${c.notes}</div></div>
    <div class="sec"><div class="row-h"><h2>${c.privacy}</h2><span style="color:var(--blue)">${c.see}</span></div></div>
    <div class="privacy"><div class="ic">✋</div><div><b>${c.privacy_title}</b><span>${c.privacy_text}</span></div></div>
    <div class="sec" style="padding-top:22px"><h2>${c.info}</h2></div>
    <div class="info">${c.rows.map(r => `<div><span>${r[0]}</span><span>${r[1]}</span></div>`).join("")}</div>
    <div class="links">${c.links.map(l => `<span>${l}</span>`).join("")}</div>
    <div class="pad"></div></div><div class="home-ind"></div>`;
}
function render() {
  document.body.dataset.theme = state.theme;
  document.documentElement.lang = state.lang;
  const c = DATA.copy[state.lang], shots = DATA.shots[state.lang];
  const keep = $("#sc2") ? $("#sc2").scrollTop : 0;
  $("#s1").innerHTML = search(c, shots);
  $("#s2").innerHTML = product(c, shots);
  if ($("#sc2")) $("#sc2").scrollTop = keep;
  $("#cap1").textContent = state.lang === "tr" ? "Arama sonuçları" : "Search results";
  $("#cap2").textContent = state.lang === "tr" ? "Ürün sayfası" : "Product page";
  $("#sub").textContent = state.lang === "tr" ? "App Store sayfası önizlemesi · gerçek uygulama ekranlarından" : "App Store page preview · built from real in-app screenshots";
  $("#foot").innerHTML = state.lang === "tr"
    ? "<b>Yayında değil.</b> Telefonların içini kaydır, AL düğmesine bas. Ekranlar iPhone 17 Pro Max simülatöründeki gerçek oyundan; yalnızca başlık ve çerçeve eklendi. Değerlendirme alanı bilerek boş: henüz yorum yok."
    : "<b>Not live.</b> Scroll inside the phones and tap GET. Screens come from the real game on an iPhone 17 Pro Max simulator; only a headline and a frame were added. The ratings area is empty on purpose: there are no reviews yet.";
  document.querySelectorAll("[data-get] .get").forEach(b => b.onclick = onGet);
  const more = $("#more"); if (more) more.onclick = () => { $("#desc").classList.remove("clamp"); more.remove(); };
  document.querySelectorAll(".seg [data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === state.lang));
  document.querySelectorAll(".seg [data-theme]").forEach(b => b.setAttribute("aria-pressed", b.dataset.theme === state.theme));
}
function onGet() {
  if (state.get !== "idle") return;
  state.get = "loading"; swapGet();
  setTimeout(() => { state.get = "done"; swapGet(); }, 1300);
}
function swapGet() {
  document.querySelectorAll("[data-get]").forEach(h => { h.innerHTML = getBtn(); h.querySelector(".get").onclick = onGet; });
}
document.querySelectorAll(".seg [data-lang]").forEach(b => b.onclick = () => { state.lang = b.dataset.lang; state.get = "idle"; render(); });
document.querySelectorAll(".seg [data-theme]").forEach(b => b.onclick = () => { state.theme = b.dataset.theme; render(); });
// Deep link for review images: #lang=tr&theme=light&scroll=1400&shots=900
const q = new URLSearchParams(location.hash.slice(1));
if (q.get("lang") in DATA.copy) state.lang = q.get("lang");
if (q.get("theme") === "light") state.theme = "light";
render();
if (q.get("scroll")) $("#sc2").scrollTop = +q.get("scroll");
if (q.get("shots")) $("#sc2").querySelector(".shots").scrollLeft = +q.get("shots");
</script>
